name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  # No paths-ignore on PRs: typecheck / vitest / playwright-gate are required
  # checks, so a docs-only PR that skipped CI could never merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
      - name: 🔎 Type check
        run: pnpm run typecheck

  vitest:
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
      - name: ⚡ Run vitest
        run: pnpm run test

  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
      - name: 🔑 Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 📦 Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: 📥 Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: 📥 Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: 🎭 Playwright tests
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: 📊 Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  playwright-gate:
    needs: playwright
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - run: |
          if [ "${{ needs.playwright.result }}" = "success" ]; then
            exit 0
          else
            exit 1
          fi
