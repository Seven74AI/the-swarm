<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key screens · sheets</title><style>/* Governs: EXPERIENCE Offline summary, Decision event (ignore policy, lifecycle hint), Battle summary; DESIGN Bottom sheet, Meter. Tokens from DESIGN.md frontmatter; mock font falls back to system mono (spec ships "Swarm Mono"). CRT default SCENE: no scanlines on text. */
@font-face{font-family:"Swarm Mono";src:local("JetBrains Mono"),local("IBM Plex Mono"),local("DejaVu Sans Mono");}
body{margin:0;background:#161616;color:#ddd;font-family:system-ui,sans-serif;padding:20px}
header{max-width:1200px;margin:0 auto 14px}h1{font-size:20px;margin:0 0 6px}header p{color:#aaa;font-size:13px;line-height:1.45;margin:4px 0;max-width:860px}
.row{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}
figure{margin:0}figcaption{font-size:13px;color:#ccc;margin:0 0 6px 4px;max-width:360px}figcaption small{display:block;color:#888;font-size:11.5px;margin-top:2px}
.ph{width:360px;height:640px;background:var(--bg);color:var(--accent);font:400 .875rem/1.3 "Swarm Mono",ui-monospace,Menlo,Consolas,monospace;border:7px solid #000;border-radius:28px;box-sizing:content-box;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph.short{height:512px}
.dim{color:var(--dim)}.warn{color:var(--warn)}.acc{color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 6px;border-bottom:1px solid var(--line);min-height:44px}
.strip.four{grid-template-columns:repeat(4,1fr)}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px}.lab{font-size:.75rem;color:var(--dim);display:flex;align-items:center;gap:3px}
.val{font-size:.9375rem;font-weight:700;text-shadow:0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}.del{font-size:.75rem;color:var(--dim)}.del.neg{color:var(--warn)}
.g{vertical-align:-2px}
.cmeter{font-size:.75rem;padding:4px 14px;color:var(--dim);border-bottom:1px solid var(--line)}
.pl{padding:10px 14px 2px}.pname{font-size:1.25rem;font-weight:700;letter-spacing:.08em;text-shadow:0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.goal{font-size:.75rem;color:var(--dim);margin-top:2px}.goal b{color:var(--accent)}
.mt{font-size:.75rem;white-space:pre;margin-top:3px}.mt .f{color:var(--accent)}.mt .e{color:var(--edge)}
.cond{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim)}.cond .ok{color:var(--accent)}
.scene{flex:0 0 auto;position:relative}
.clabel{position:absolute;font-size:.75rem;color:var(--dim);background:var(--bg);padding:0 2px}
.log{padding:4px 14px;flex:1;overflow:hidden}.log p{margin:2px 0;font-size:.75rem;color:var(--dim)}.log p.new{color:var(--accent)}
.card{border:1px solid var(--line);margin:8px 14px;padding:10px 12px}.card.sel{background:var(--raised)}.card.new{border-color:var(--accent);box-shadow:0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}
.ct{font-weight:700;display:flex;align-items:center;gap:6px}.ct small{font-weight:400;color:var(--dim)}.ce{font-size:.75rem;color:var(--dim);margin-top:3px}
.cc{font-size:.8125rem;color:var(--dim);margin-top:4px}
.btn{display:block;width:100%;min-height:44px;margin-top:8px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font:700 .875rem "Swarm Mono",ui-monospace,Menlo,monospace;text-align:left;padding:0 12px}
.btn.dis{border:1px dashed var(--edge);color:var(--dim);font-weight:400}
.sec{display:block;width:100%;min-height:44px;background:transparent;border:0;color:var(--dim);font:.8125rem "Swarm Mono",ui-monospace,monospace}
.pz{height:64px;padding:7px 14px;box-sizing:border-box;border-top:1px solid var(--line)}
.pb{width:100%;height:50px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font:700 .9375rem "Swarm Mono",ui-monospace,Menlo,monospace;text-align:left;padding:0 12px;display:flex;flex-direction:column;justify-content:center;text-shadow:0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.pb small{font-weight:400;font-size:.8125rem;color:var(--dim);text-shadow:none}
.pb.press{background:var(--accent);color:var(--bg);text-shadow:none}.pb.press small{color:var(--bg)}
.pzinfo{height:50px;display:flex;align-items:center;justify-content:center;font-size:.8125rem;color:var(--dim)}
.tabs{display:flex;height:52px;border-top:1px solid var(--line)}.tabs div{flex:1;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--dim)}
.tabs .on{background:var(--accent);color:var(--bg);font-weight:700}.tabs em{font-style:normal;color:var(--accent);margin-left:3px}
.seg{display:flex;gap:0;margin:8px 14px 4px;font-size:.75rem}.seg span{padding:0 12px;height:32px;display:flex;align-items:center;color:var(--dim)}.seg .on{background:var(--accent);color:var(--bg);font-weight:700}
.scr{flex:1;overflow:hidden}
.hdr{padding:10px 14px 2px;font-size:1.25rem;font-weight:700;letter-spacing:.08em}
.up{padding:2px 14px 6px;font-size:.75rem;color:var(--dim);border-bottom:1px solid var(--line)}.up b{font-size:.9375rem;color:var(--accent)}
.mult{padding:6px 14px;font-size:.75rem;color:var(--dim)}.mult span{padding:2px 6px}.mult .on{background:var(--accent);color:var(--bg);font-weight:700}
.role{display:grid;grid-template-columns:64px 1fr 30px 96px;align-items:center;height:44px;padding:0 14px;font-size:.8125rem;border-bottom:1px solid var(--line)}
.role .bar{letter-spacing:-1px;white-space:nowrap;overflow:hidden}.role .bar i{font-style:normal;color:var(--edge)}.role .n{text-align:right;font-weight:700}
.role .st{display:flex;justify-content:flex-end;gap:4px}.role .st span{width:44px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--edge);font-weight:700}
.auto{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:44px;padding:0 14px;font-size:.75rem;color:var(--dim);border-bottom:1px solid var(--line)}
.auto .on{background:var(--accent);color:var(--bg);font-weight:700;padding:4px 8px}
.scrim{position:absolute;inset:0;background:#000000b3}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-top:1.5px solid var(--accent);padding:4px 16px 14px}
.handle{text-align:center;color:var(--edge);font-size:.75rem}.sh{font-size:1.5rem;font-weight:700;letter-spacing:.1em;margin:6px 0 4px;text-shadow:0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.sheet p{margin:4px 0}.sheet .rows{font-size:.8125rem}.sheet .rows div{display:flex;justify-content:space-between;padding:2px 0}
.ign{font-size:.75rem;color:var(--dim);margin-top:6px}
.peek{position:absolute;left:0;right:0;bottom:52px;background:var(--raised);border-top:1.5px solid var(--accent);padding:4px 14px 10px;max-height:160px;box-sizing:border-box}
.peek .two{display:flex;gap:8px}.peek .two .btn{flex:1;text-align:center}
.pan{position:absolute;right:16px;top:10px;font-size:.75rem;color:var(--dim)}
.map{margin:4px 12px 0}
